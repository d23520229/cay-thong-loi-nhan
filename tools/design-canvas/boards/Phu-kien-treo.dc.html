<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Phụ kiện treo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Grape+Nuts&family=Mynerve&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7D5B}a:hover{color:#1F5A40}

.tree-sway{transform-box:view-box;transform-origin:200px 470px;animation:tree-sway 5.5s ease-in-out infinite}
@keyframes tree-sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
.light{animation:twinkle 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.top-star{transform-box:view-box;animation:star-bob 3s ease-in-out infinite}
.top-star .halo{transform-box:view-box;animation:halo 3s ease-in-out infinite}
@keyframes star-bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.04)}}
@keyframes halo{0%,100%{transform:scale(.8);opacity:.2}50%{transform:scale(1.15);opacity:.5}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.shake .tree-sway{animation:tree-shake .7s ease-in-out}
@keyframes tree-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3.5deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}}
.shake .light{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.2}30%{opacity:1;filter:brightness(1.8)}100%{opacity:1}}
.snow-drop{animation:snow-drop 1.3s ease-in forwards}
@keyframes snow-drop{from{transform:translateY(0);opacity:1}to{transform:translateY(var(--fall,120px));opacity:0}}
@media (prefers-reduced-motion:reduce){.tree-sway,.light,.top-star,.top-star .halo,.blink{animation:none}}


.snowflake{animation:snowfall linear infinite}
@keyframes snowfall{from{transform:translate(0,calc(-1 * var(--fall,300px)))}to{transform:translate(var(--dx,0),0)}}
.gust .snowflake{animation-duration:1.4s!important}
.twinkle-star{animation:twinkle 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.moon-glow{transform-box:fill-box;transform-origin:center;animation:moon 4s ease-in-out infinite}
@keyframes moon{0%,100%{transform:scale(1);opacity:.15}50%{transform:scale(1.2);opacity:.3}}
.gust .moon-glow{animation:moon .6s ease-in-out 3}
.curtain{transform-box:view-box;animation:curtain 7s ease-in-out infinite}
@keyframes curtain{0%,100%{transform:skewX(0)}50%{transform:skewX(1.2deg)}}
.gust .curtain{animation:curtain-gust 1.2s ease-in-out}
@keyframes curtain-gust{0%,100%{transform:skewX(0)}30%{transform:skewX(4deg)}60%{transform:skewX(-2deg)}}
.wall-light{animation:twinkle 1.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.gust .wall-light{animation:chase .25s linear 6;animation-delay:var(--d,0s)}
@keyframes chase{0%,100%{opacity:1}50%{opacity:.2}}
.hang,.flag{transform-box:view-box;animation:swing 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.gust .hang,.gust .flag{animation:swing .5s ease-in-out 3}
.flame{transform-box:view-box;animation:flame .9s ease-in-out infinite alternate}
@keyframes flame{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.steam{animation:steam 3s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
.clock-hand{transform-box:view-box;animation:clock 10s linear infinite}
@keyframes clock{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.snowflake,.twinkle-star,.moon-glow,.curtain,.wall-light,.hang,.flag,.flame,.steam,.clock-hand{animation:none}}


.pet{transform-box:fill-box;transform-origin:50% 100%}
.pet .breath{transform-box:fill-box;transform-origin:50% 100%;animation:pet-breath 3.2s ease-in-out infinite}
@keyframes pet-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.pet .head{transform-box:fill-box;transform-origin:50% 90%;animation:pet-head 4.5s ease-in-out infinite}
@keyframes pet-head{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.pet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.pet-cat .eyes{animation-delay:.8s}.pet-owl .eyes{animation-delay:2s}.pet-bear .eyes{animation-delay:1.4s}
.pet .tail{transform-box:fill-box;transform-origin:0% 100%;animation:pet-tail 1.6s ease-in-out infinite}
@keyframes pet-tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
.pet-dog .tail{animation-duration:.8s}
.pet .ear{transform-box:fill-box;transform-origin:50% 0%}
.pet .flip-l{transform-box:fill-box;transform-origin:100% 0%}
.pet .flip-r{transform-box:fill-box;transform-origin:0% 0%}
.pet .arm-r{transform-box:fill-box;transform-origin:20% 10%}
.pet-hearts{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.pop .pet{animation:pet-hop .65s cubic-bezier(.3,1.6,.5,1)}
@keyframes pet-hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(0) scale(1.08,.9)}55%{transform:translateY(-22px) scale(.95,1.06)}100%{transform:translateY(0) scale(1,1)}}
.pop .pet-hearts{animation:hearts 1.3s ease-out}
@keyframes hearts{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.1)}}
.pop .pet .tail{animation:pet-tail .18s ease-in-out 7}
.pop .pet-dog .ear-l{animation:ear-flop-l .25s ease-in-out 4}
.pop .pet-dog .ear-r{animation:ear-flop-r .25s ease-in-out 4}
@keyframes ear-flop-l{50%{transform:rotate(18deg)}}
@keyframes ear-flop-r{50%{transform:rotate(-18deg)}}
.pop .pet-owl .head{animation:owl-turn 1.1s ease-in-out}
@keyframes owl-turn{0%,100%{transform:rotate(0)}35%{transform:rotate(-24deg)}70%{transform:rotate(18deg)}}
.pop .pet-deer .head{animation:deer-nod .35s ease-in-out 3}
@keyframes deer-nod{50%{transform:rotate(8deg)}}
.pop .pet-bear .arm-r{animation:bear-wave .35s ease-in-out 4}
@keyframes bear-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-130deg)}}
.pop .pet-penguin .flip-l{animation:flap-l .18s ease-in-out 7}
.pop .pet-penguin .flip-r{animation:flap-r .18s ease-in-out 7}
@keyframes flap-l{50%{transform:rotate(30deg)}}
@keyframes flap-r{50%{transform:rotate(-30deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.pet .breath,.pet .head,.pet .eyes,.pet .tail{animation:none}}


.prop{transform-box:fill-box;transform-origin:50% 100%}
.fire .flame-a{transform-box:fill-box;transform-origin:50% 100%;animation:fire 1.1s ease-in-out infinite alternate}
.fire .flame-b{transform-box:fill-box;transform-origin:50% 100%;animation:fire .8s ease-in-out infinite alternate-reverse}
.fire .flame-c{transform-box:fill-box;transform-origin:50% 100%;animation:fire .6s ease-in-out infinite alternate}
@keyframes fire{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.92,1.12) skewX(3deg)}}
.fire-glow{transform-box:fill-box;transform-origin:center;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}
.puff{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff 3.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes puff{0%{opacity:0;transform:translate(0,10px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-46px) scale(1.4)}}
.fire-sparks circle{opacity:0}
.stocking{transform-box:view-box;animation:swing 3.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.flame{transform-box:view-box;animation:flame .9s ease-in-out infinite alternate}
.candle-glow{transform-box:fill-box;transform-origin:center;animation:glow 2s ease-in-out infinite}
.bow{transform-box:fill-box;transform-origin:50% 80%;animation:bow 2.8s ease-in-out infinite}
@keyframes bow{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.swing{transform-box:fill-box;transform-origin:50% 0%;animation:swing 4s ease-in-out infinite}
.scarf-tail{transform-box:fill-box;transform-origin:0% 0%;animation:bow 1.8s ease-in-out infinite}
.sparkles path{opacity:0;transform-box:fill-box;transform-origin:center}
.prop .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.pop .prop:not(.heavy){animation:prop-hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes prop-hop{0%{transform:translateY(0) scale(1,1)}25%{transform:scale(1.08,.9)}55%{transform:translateY(-16px) scale(.96,1.05)}100%{transform:translateY(0)}}
.pop .sparkles path{animation:sparkle 1s ease-out;animation-delay:var(--d,0s)}
@keyframes sparkle{0%{opacity:0;transform:scale(.2) translateY(10px)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(-18px)}}
.pop .gift-lid{transform-box:fill-box;transform-origin:50% 100%;animation:lid .9s ease-in-out}
@keyframes lid{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-22px) rotate(-12deg)}70%{transform:translateY(-8px) rotate(5deg)}}
.pop .fire .flame-a,.pop .fire .flame-b{animation:fire-burst 1.2s ease-out}
@keyframes fire-burst{0%{transform:scale(1)}30%{transform:scale(1.25,1.6)}100%{transform:scale(1)}}
.pop .fire-sparks circle{animation:fire-spark 1.2s ease-out;animation-delay:var(--d,0s)}
@keyframes fire-spark{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}
.pop .puff{animation-duration:1.2s}
.pop .stocking{animation:swing .4s ease-in-out 3}
.pop .swing{animation:swing .5s ease-in-out 3}
.pop .cushion{transform-box:fill-box;transform-origin:50% 100%;animation:squish .6s ease-in-out}
@keyframes squish{40%{transform:scale(1.08,.7)}}
.pop .flame{animation:flame .15s ease-in-out 8 alternate}
.pop .prop-deco-snowman .hat{transform-box:fill-box;transform-origin:0% 100%;animation:hat-tip .9s ease-in-out}
@keyframes hat-tip{40%{transform:translateY(-10px) rotate(-18deg)}}
.pop .prop-furn-rug{animation:rug .6s ease-in-out}
@keyframes rug{30%{transform:scale(1.04,.92)}}
.pop .shelf-plant{transform-box:fill-box;transform-origin:50% 100%;animation:swing .3s ease-in-out 4}
@media (prefers-reduced-motion:reduce){.fire .flame-a,.fire .flame-b,.fire .flame-c,.fire-glow,.puff,.stocking,.flame,.candle-glow,.bow,.swing,.scarf-tail{animation:none}}


.ornament{transform-box:fill-box;transform-origin:50% 0%;animation:orn-swing 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes orn-swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.ornament.st-locked .orn-body{filter:saturate(.25) brightness(1.08);opacity:.75}
.ornament.st-unread .orn-body{animation:orn-shine 1.6s ease-in-out infinite}
@keyframes orn-shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) drop-shadow(0 0 4px #FFE27A)}}
.glint path{transform-box:fill-box;transform-origin:center;animation:glint 1.4s ease-in-out infinite}
.glint path:nth-child(2){animation-delay:.7s}
@keyframes glint{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1.1);opacity:1}}
.slot-bubble{transform-box:fill-box;transform-origin:50% 60%;animation:bubble 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bubble{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.06);opacity:1}}
.slot-bubble .bubble-glow{transform-box:fill-box;transform-origin:center;animation:glow 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.slot-bubble.dim{opacity:.45;animation:none}
.pop .ornament{animation:orn-ring .9s ease-in-out}
@keyframes orn-ring{0%,100%{transform:rotate(0)}15%{transform:rotate(-26deg)}35%{transform:rotate(20deg)}55%{transform:rotate(-12deg)}75%{transform:rotate(6deg)}}
.pop .slot-bubble{animation:bubble-pop .5s ease-out}
@keyframes bubble-pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.drop-in .ornament{animation:orn-drop .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes orn-drop{0%{transform:translateY(-60px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.ornament,.slot-bubble,.slot-bubble .bubble-glow,.glint path,.ornament.st-unread .orn-body{animation:none}}


.no-face .tree-face{display:none}
.hide-tree .tree{display:none}
.pill{font:inherit;cursor:pointer;min-height:44px;padding:8px 18px;border-radius:999px;border:2.5px solid #3A2E2A;background:#FFFDF8;color:#3A2E2A;font-size:20px}
.pill:hover{background:#FFEFD2}
.scene{position:relative;padding:0;border:3px solid #3A2E2A;border-radius:32px;overflow:hidden;cursor:pointer;background:#FFF6E5;display:block}


</style>
</helmet>
<div style="width: 1720px; box-sizing: border-box; padding: 56px; display: flex; flex-direction: column; gap: 32px; background: #FFF6E5; font-family: 'Mynerve', cursive; color: #3A2E2A">
<header style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Amatic SC', cursive; font-size: 80px; line-height: 1; color: #D94B4B">Phụ kiện treo lời nhắn</h1>
<p style="margin: 0; font-size: 21px; line-height: 1.4; max-width: 980px">Người viết chọn 1 trong 20 phụ kiện để treo lời nhắn. Tất cả đều đung đưa nhẹ quanh móc. Chạm vào (chế độ Play) để phụ kiện lắc mạnh. Hàng dưới là các trạng thái của một điểm nhắn.</p>
<div style="display: flex; gap: 32px; flex-wrap: wrap"></div>
</header>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
<button type="button" class="scene {{cls0}}" onClick="{{tap0}}" aria-label="Tất Noel: chạm để xem hiệu ứng" style="width: 140px; height: 140px">
<svg viewBox="-30 -6 60 60" width="140" height="140" aria-hidden="true"><rect x="-30" y="-6" width="60" height="60" fill="#5DC3C0"/><rect x="-30" y="-6" width="60" height="60" fill="#3E8FB3" opacity=".25"/><defs><radialGradient id="ow-D94B4B" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#e68a8a"/><stop offset=".55" stop-color="#D94B4B"/><stop offset="1" stop-color="#b84040"/></radialGradient><radialGradient id="ow-FFFFFF" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#d9d9d9"/></radialGradient></defs><g class="ornament orn-sock st-filled" style="--d:0s" data-part="ornament"><g class="orn-body"><path d="M 0 0 L 0 6" stroke="#6E5A52" stroke-width="1.4" stroke-opacity=".9" opacity=".7"/>
    <path d="M -9 8 L 9 8 L 9 30 Q 10 40 0 42 L -12 42 Q -22 40 -20 33 Q -18 28 -9 28 Z" fill="url(#ow-D94B4B)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -8 34 q 4 3 8 0" stroke="#fff" stroke-width="2" fill="none" opacity=".8"/>
    <rect x="-11" y="4" width="22" height="9" rx="4" fill="url(#ow-FFFFFF)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/></g></g></svg>
</button>
<figcaption style="font-family: 'Grape Nuts', cursive; font-size: 24px; text-align: center; max-width: 140px">Tất Noel</figcaption>

</figure>
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
<button type="button" class="scene {{cls1}}" onClick="{{tap1}}" aria-label="Ngôi sao: chạm để xem hiệu ứng" style="width: 140px; height: 140px">
<svg viewBox="-30 -6 60 60" width="140" height="140" aria-hidden="true"><rect x="-30" y="-6" width="60" height="60" fill="#5DC3C0"/><rect x="-30" y="-6" width="60" height="60" fill="#3E8FB3" opacity=".25"/><defs><radialGradient id="ow-FFD447" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffe387"/><stop offset=".55" stop-color="#FFD447"/><stop offset="1" stop-color="#d9b43c"/></radialGradient><radialGradient id="ow-FF8FA3" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffb6c3"/><stop offset=".55" stop-color="#FF8FA3"/><stop offset="1" stop-color="#d97a8b"/></radialGradient></defs><g class="ornament orn-star st-filled" style="--d:0s" data-part="ornament"><g class="orn-body"><path d="M 0 0 L 0 8" stroke="#6E5A52" stroke-width="1.4" stroke-opacity=".9" opacity=".7"/><polygon points="0,6 5.6,18.3 19,19.8 9,28.9 11.8,42.2 0,35.5 -11.8,42.2 -9,28.9 -19,19.8 -5.6,18.3" fill="url(#ow-FFD447)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-4.5" cy="26" r="1.53" fill="#3A2E2A"/><circle cx="4.5" cy="26" r="1.53" fill="#3A2E2A"/><path d="M -2.4 29 Q 0 31 2.4 29" fill="none" stroke="#6E5A52" stroke-width="1.4" stroke-opacity=".9" stroke-linecap="round"/><ellipse cx="-7.5" cy="29.2" rx="2.6" ry="1.6" fill="url(#ow-FF8FA3)" opacity=".7"/><ellipse cx="7.5" cy="29.2" rx="2.6" ry="1.6" fill="url(#ow-FF8FA3)" opacity=".7"/></g></g></svg>
</button>
<figcaption style="font-family: 'Grape Nuts', cursive; font-size: 24px; text-align: center; max-width: 140px">Ngôi sao</figcaption>

</figure>
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
<button type="button" class="scene {{cls2}}" onClick="{{tap2}}" aria-label="Bóng đèn: chạm để xem hiệu ứng" style="width: 140px; height: 140px">
<svg viewBox="-30 -6 60 60" width="140" height="140" aria-hidden="true"><rect x="-30" y="-6" width="60" height="60" fill="#5DC3C0"/><rect x="-30" y="-6" width="60" height="60" fill="#3E8FB3" opacity=".25"/><defs><radialGradient id="ow-9AA3AD" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#bdc3ca"/><stop offset=".55" stop-color="#9AA3AD"/><stop offset="1" stop-color="#838b93"/></radialGradient><radialGradient id="ow-7FD0FF" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ace0ff"/><stop offset=".55" stop-color="#7FD0FF"/><stop offset="1" stop-color="#6cb1d9"/></radialGradient></defs><g class="ornament orn-bulb st-filled" style="--d:0s" data-part="ornament"><g class="orn-body"><path d="M 0 0 L 0 4" stroke="#6E5A52" stroke-width="1.4" stroke-opacity=".9" opacity=".7"/>
    <rect x="-6" y="4" width="12" height="10" rx="2" fill="url(#ow-9AA3AD)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -6 8 L 6 8 M -6 11 L 6 11" stroke="#6E5A52" stroke-width="1.4" stroke-opacity=".9"/>
    <path d="M -6 14 Q -16 24 -12 34 Q -8 44 0 44 Q 8 44 12 34 Q 16 24 6 14 Z" fill="url(#ow-7FD0FF)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -7 22 Q -9 28 -7 33" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9"/></g></g></svg>
</button>
<figcaption style="font-family: 'Grape Nuts', cursive; font-size: 24px; text-align: center; max-width: 140px">Bóng đèn</figcaption>

</figure>
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
<button type="button" class="scene {{cls3}}" onClick="{{tap3}}" aria-label="Quả châu: chạm để xem hiệu ứng" style="width: 140px; height: 140px">
<svg viewBox="-30 -6 60 60" width="140" height="140" aria-hidden="true"><rect x="-30" y="-6" width="60" height="60" fill="#5DC3C0"/><rect x="-30" y="-6" width="60" height="60" fill="#3E8FB3" opacity=".25"/><defs><radialGradient id="ow-F4C542" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#f8d984"/><stop offset=".55" stop-color="#F4C542"/><stop offset="1" stop-color="#cfa738"/></radialGradient><radialGradient id="ow-2F8360" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#78ae98"/><stop offset=".55" stop-color="#2F8360"/><stop offset="1" stop-color="#286f52"/></radialGradient></defs><g class="ornament orn-ball st-filled" style="--d:0s" data-part="ornament"><g class="orn-body"><path d="M 0 0 L 0 4" stroke="#6E5A52" stroke-width="1.4" stroke-opacity=".9" opacity=".7"/>
    <rect x="-5" y="3" width="10" height="7" rx="2" fill="url(#ow-F4C542)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="0" cy="26" r="17" fill="url(#ow-2F8360)" stroke="#6E5A52" stroke-width="2.0" stroke-opacity=".9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M -16 22 Q 0 28 16 22" stroke="#F4C542" stroke-width="3.2" fill="none"/>
    <path d="M -15 31 Q 0 37 15 31" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-dasharray="3 3"/>
